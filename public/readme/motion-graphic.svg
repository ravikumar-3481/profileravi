<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="auto">
  <defs>
    <!-- Gradients -->
    <linearGradient id="mg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a06" />
      <stop offset="50%" stop-color="#0f140c" />
      <stop offset="100%" stop-color="#050704" />
    </linearGradient>

    <linearGradient id="lime-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="radar-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Continuous Motion Animations */
    @keyframes flow-contour-1 {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1200; }
    }
    @keyframes flow-contour-2 {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 1000; }
    }
    @keyframes rotate-radar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes counter-rotate {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes wave-bounce {
      0%, 100% { transform: scaleY(0.3); }
      50% { transform: scaleY(1); }
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.6); opacity: 0.3; }
    }
    @keyframes text-shimmer {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #a3e635); }
    }

    .contour-fast {
      stroke-dasharray: 120 180;
      animation: flow-contour-1 16s linear infinite;
    }
    .contour-slow {
      stroke-dasharray: 60 120;
      animation: flow-contour-2 22s linear infinite;
    }
    .radar-outer {
      transform-origin: 820px 160px;
      animation: rotate-radar 18s linear infinite;
    }
    .radar-inner {
      transform-origin: 820px 160px;
      animation: counter-rotate 10s linear infinite;
    }
    .pulse-ring {
      transform-origin: 820px 160px;
      animation: pulse-dot 3s ease-in-out infinite;
    }
    .shimmer-text {
      animation: text-shimmer 4s ease-in-out infinite;
    }

    /* Wave bars staggered animations */
    .wb-1 { animation: wave-bounce 1.1s ease-in-out infinite alternate; transform-origin: center bottom; }
    .wb-2 { animation: wave-bounce 1.4s ease-in-out infinite alternate; transform-origin: center bottom; animation-delay: 0.15s; }
    .wb-3 { animation: wave-bounce 0.9s ease-in-out infinite alternate; transform-origin: center bottom; animation-delay: 0.3s; }
    .wb-4 { animation: wave-bounce 1.6s ease-in-out infinite alternate; transform-origin: center bottom; animation-delay: 0.45s; }
    .wb-5 { animation: wave-bounce 1.2s ease-in-out infinite alternate; transform-origin: center bottom; animation-delay: 0.6s; }
    .wb-6 { animation: wave-bounce 1.5s ease-in-out infinite alternate; transform-origin: center bottom; animation-delay: 0.75s; }
    .wb-7 { animation: wave-bounce 1.0s ease-in-out infinite alternate; transform-origin: center bottom; animation-delay: 0.9s; }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="320" rx="14" fill="url(#mg-bg)" stroke="#222b1c" stroke-width="1.5" />

  <!-- Animated Topographic Contours in Background -->
  <g fill="none">
    <path
      class="contour-fast"
      d="M -50 120 C 180 40, 360 220, 580 140 C 780 60, 920 220, 1050 160"
      stroke="#a3e635"
      stroke-width="1.5"
      opacity="0.3"
      filter="url(#neon-glow)"
    />
    <path
      class="contour-slow"
      d="M -50 210 C 220 280, 420 100, 640 180 C 820 250, 940 90, 1050 200"
      stroke="#38bdf8"
      stroke-width="1.2"
      opacity="0.25"
    />
    <path
      d="M -50 260 C 150 190, 350 310, 550 240 C 750 170, 950 290, 1050 250"
      stroke="#4ade80"
      stroke-width="0.8"
      stroke-dasharray="4 8"
      opacity="0.2"
    />
  </g>

  <!-- Left Side: Live Engine Information & Visual Pulse -->
  <g transform="translate(50, 48)">
    <!-- Active Status Indicator Pill -->
    <rect width="210" height="30" rx="15" fill="#151d11" stroke="#334227" stroke-width="1" />
    <circle cx="18" cy="15" r="4.5" fill="#a3e635" filter="url(#neon-glow)" />
    <circle class="pulse-ring" cx="18" cy="15" r="7" fill="none" stroke="#a3e635" stroke-width="1" />
    <text x="34" y="19" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1">
      ENGINE ACTIVE // 60 FPS
    </text>

    <!-- Main Motion Graphic Title -->
    <text class="shimmer-text" x="0" y="68" fill="url(#lime-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Reactive Motion &amp; Micro-UX
    </text>

    <!-- Dynamic Subtext -->
    <text x="0" y="104" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">
      Real-time Framer Motion transitions, live event hooks &amp; accessible navigation.
    </text>

    <!-- Equalizer Harmonic Waveform Bars -->
    <g transform="translate(0, 130)">
      <text x="0" y="24" fill="#64748b" font-family="ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="1">
        NEURAL SIGNAL
      </text>
      <g transform="translate(115, 0)">
        <rect class="wb-1" x="0" y="0" width="4" height="32" rx="2" fill="#a3e635" />
        <rect class="wb-2" x="8" y="0" width="4" height="32" rx="2" fill="#4ade80" />
        <rect class="wb-3" x="16" y="0" width="4" height="32" rx="2" fill="#38bdf8" />
        <rect class="wb-4" x="24" y="0" width="4" height="32" rx="2" fill="#a3e635" />
        <rect class="wb-5" x="32" y="0" width="4" height="32" rx="2" fill="#4ade80" />
        <rect class="wb-6" x="40" y="0" width="4" height="32" rx="2" fill="#38bdf8" />
        <rect class="wb-7" x="48" y="0" width="4" height="32" rx="2" fill="#a3e635" />
        <rect class="wb-2" x="56" y="0" width="4" height="32" rx="2" fill="#4ade80" />
        <rect class="wb-4" x="64" y="0" width="4" height="32" rx="2" fill="#38bdf8" />
        <rect class="wb-1" x="72" y="0" width="4" height="32" rx="2" fill="#a3e635" />
        <rect class="wb-3" x="80" y="0" width="4" height="32" rx="2" fill="#4ade80" />
        <rect class="wb-5" x="88" y="0" width="4" height="32" rx="2" fill="#38bdf8" />
      </g>
    </g>

    <!-- Realtime Metric Badges -->
    <g transform="translate(0, 185)">
      <rect width="110" height="24" rx="4" fill="#1b2416" stroke="#2d3c24" stroke-width="1" />
      <text x="55" y="16" fill="#a3e635" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">
        0.0ms INP
      </text>

      <rect x="120" y="0" width="110" height="24" rx="4" fill="#1b2416" stroke="#2d3c24" stroke-width="1" />
      <text x="175" y="16" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">
        100% LIGHTHOUSE
      </text>

      <rect x="240" y="0" width="110" height="24" rx="4" fill="#1b2416" stroke="#2d3c24" stroke-width="1" />
      <text x="295" y="16" fill="#4ade80" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">
        W3C VALIDATED
      </text>
    </g>
  </g>

  <!-- Right Side: Rotating Kinetic Gyroscope Radar -->
  <g>
    <!-- Background Stationary Glow -->
    <circle cx="820" cy="160" r="110" fill="#a3e635" opacity="0.04" />
    <circle cx="820" cy="160" r="90" fill="none" stroke="#232f1b" stroke-width="1" />
    <circle cx="820" cy="160" r="60" fill="none" stroke="#232f1b" stroke-width="1" stroke-dasharray="3 5" />
    
    <!-- Outer Rotating Radar -->
    <g class="radar-outer">
      <circle cx="820" cy="160" r="85" fill="none" stroke="#a3e635" stroke-width="1.2" stroke-dasharray="12 45 30 60" />
      <circle cx="820" cy="75" r="4.5" fill="#a3e635" filter="url(#neon-glow)" />
      <circle cx="820" cy="245" r="3" fill="#38bdf8" />
    </g>

    <!-- Inner Counter-Rotating Gyroscope -->
    <g class="radar-inner">
      <circle cx="820" cy="160" r="50" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="20 40" />
      <line x1="820" y1="110" x2="820" y2="210" stroke="#38bdf8" stroke-width="0.8" opacity="0.6" />
      <line x1="770" y1="160" x2="870" y2="160" stroke="#38bdf8" stroke-width="0.8" opacity="0.6" />
      <circle cx="870" cy="160" r="3.5" fill="#4ade80" />
    </g>

    <!-- Core Center Pulsing Hub -->
    <circle cx="820" cy="160" r="18" fill="#151f12" stroke="#4ade80" stroke-width="1.5" />
    <circle cx="820" cy="160" r="6" fill="#a3e635" filter="url(#neon-glow)" />
    
    <!-- Compass Cardinal Marks -->
    <text x="820" y="60" fill="#64748b" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">N 0°</text>
    <text x="925" y="163" fill="#64748b" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">90°</text>
    <text x="820" y="265" fill="#64748b" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">180°</text>
    <text x="715" y="163" fill="#64748b" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">270°</text>
  </g>
</svg>
