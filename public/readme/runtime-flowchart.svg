<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="100%" height="auto">
  <defs>
    <linearGradient id="flow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d08" />
      <stop offset="100%" stop-color="#12180e" />
    </linearGradient>

    <linearGradient id="step-active" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24331b" />
      <stop offset="100%" stop-color="#141c10" />
    </linearGradient>

    <linearGradient id="line-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    @keyframes pulse-flow {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    .flow-dash {
      stroke-dasharray: 8 8;
      animation: pulse-flow 2s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1100" height="460" rx="14" fill="url(#flow-bg)" stroke="#222b1c" stroke-width="1.5" />

  <!-- Flowchart Header -->
  <g transform="translate(45, 38)">
    <text x="0" y="0" fill="#a3e635" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="2">
      DATAFLOW &amp; EVENT EXECUTION TOPOLOGY
    </text>
    <text x="0" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700">
      Lifecycle of a Client Action (Keyboard, Route, Motion)
    </text>
  </g>

  <!-- Connecting Animated Pipeline Line -->
  <g>
    <!-- Node 1 to Node 2 -->
    <path d="M 235 220 L 285 220" stroke="#a3e635" stroke-width="2" class="flow-dash" />
    <polygon points="285,216 295,220 285,224" fill="#a3e635" />

    <!-- Node 2 to Node 3 -->
    <path d="M 485 220 L 535 220" stroke="#4ade80" stroke-width="2" class="flow-dash" />
    <polygon points="535,216 545,220 535,224" fill="#4ade80" />

    <!-- Node 3 to Node 4 -->
    <path d="M 735 220 L 785 220" stroke="#38bdf8" stroke-width="2" class="flow-dash" />
    <polygon points="785,216 795,220 785,224" fill="#38bdf8" />
  </g>

  <!-- Step 1: User Input / Event Trigger -->
  <g transform="translate(45, 115)" filter="url(#box-shadow)">
    <rect width="190" height="250" rx="10" fill="url(#step-active)" stroke="#394f2b" stroke-width="1.2" />
    <rect width="190" height="38" rx="10" fill="#202e18" />
    <path d="M 0,28 L 0,38 L 190,38 L 190,28 Z" fill="#202e18" />
    <circle cx="20" cy="19" r="4.5" fill="#a3e635" />
    <text x="32" y="23" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">1. INPUT TRIGGER</text>

    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#a3e635" font-family="ui-monospace, monospace" font-size="10" font-weight="600">[EVENTS]</text>
      <text x="0" y="34" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">• Global Keydown</text>
      <text x="0" y="50" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">H, A, P, J, S, W, C, T, R</text>

      <text x="0" y="74" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">• Skip-Link Tab</text>
      <text x="0" y="90" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Focus #main-content</text>

      <text x="0" y="114" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">• Arrow Key Cycle</text>
      <text x="0" y="130" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Nav &amp; tablist switching</text>

      <text x="0" y="154" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">• Pointer Clicks</text>
      <text x="0" y="170" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Router link navigations</text>
    </g>
  </g>

  <!-- Step 2: Protection & Sanitization -->
  <g transform="translate(295, 115)" filter="url(#box-shadow)">
    <rect width="190" height="250" rx="10" fill="url(#step-active)" stroke="#394f2b" stroke-width="1.2" />
    <rect width="190" height="38" rx="10" fill="#202e18" />
    <path d="M 0,28 L 0,38 L 190,38 L 190,28 Z" fill="#202e18" />
    <circle cx="20" cy="19" r="4.5" fill="#4ade80" />
    <text x="32" y="23" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">2. FILTER &amp; GUARD</text>

    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#4ade80" font-family="ui-monospace, monospace" font-size="10" font-weight="600">[SHIELD]</text>
      <text x="0" y="34" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">• Input Isolation</text>
      <text x="0" y="50" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Ignores input &amp; textarea</text>

      <text x="0" y="74" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">• Rate Limiter</text>
      <text x="0" y="90" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Checks local timestamp</text>

      <text x="0" y="114" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">• Honeypot Guard</text>
      <text x="0" y="130" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Validates hidden traps</text>

      <text x="0" y="154" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">• Modifier Traps</text>
      <text x="0" y="170" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Ctrl+K / Cmd+K handler</text>
    </g>
  </g>

  <!-- Step 3: TanStack Router Engine -->
  <g transform="translate(545, 115)" filter="url(#box-shadow)">
    <rect width="190" height="250" rx="10" fill="url(#step-active)" stroke="#394f2b" stroke-width="1.2" />
    <rect width="190" height="38" rx="10" fill="#202e18" />
    <path d="M 0,28 L 0,38 L 190,38 L 190,28 Z" fill="#202e18" />
    <circle cx="20" cy="19" r="4.5" fill="#38bdf8" />
    <text x="32" y="23" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">3. ROUTER &amp; SEO</text>

    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10" font-weight="600">[MATCHING]</text>
      <text x="0" y="34" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">• File Route Match</text>
      <text x="0" y="50" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Type-safe tree resolution</text>

      <text x="0" y="74" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">• Dynamic SEO Tags</text>
      <text x="0" y="90" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Canonical &amp; OG injection</text>

      <text x="0" y="114" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">• JSON-LD Schema</text>
      <text x="0" y="130" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Breadcrumbs &amp; Person</text>

      <text x="0" y="154" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">• State Navigation</text>
      <text x="0" y="170" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">useNavigate programmatic</text>
    </g>
  </g>

  <!-- Step 4: Motion & Viewport Render -->
  <g transform="translate(795, 115)" filter="url(#box-shadow)">
    <rect width="260" height="250" rx="10" fill="url(#step-active)" stroke="#4e683b" stroke-width="1.4" />
    <rect width="260" height="38" rx="10" fill="#2d3f23" />
    <path d="M 0,28 L 0,38 L 260,38 L 260,28 Z" fill="#2d3f23" />
    <circle cx="20" cy="19" r="4.5" fill="#a855f7" />
    <text x="32" y="23" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">4. MOTION &amp; VIEWPORT RENDER</text>

    <g transform="translate(18, 55)">
      <text x="0" y="15" fill="#c084fc" font-family="ui-monospace, monospace" font-size="10" font-weight="600">[FRAMER MOTION &amp; DOM]</text>
      <text x="0" y="34" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">• AnimatePresence Transition</text>
      <text x="0" y="50" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Exit active route &amp; enter target</text>

      <text x="0" y="74" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">• ViewportReveal Triggers</text>
      <text x="0" y="90" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">IntersectionObserver threshold</text>

      <text x="0" y="114" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">• Tabular-Nums Counters</text>
      <text x="0" y="130" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Eased count-up RAF loop</text>

      <text x="0" y="154" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">• Accessibility Focus Visible</text>
      <text x="0" y="170" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Accent focus ring on landmark</text>
    </g>
  </g>

  <!-- Bottom Indicator Bar -->
  <g transform="translate(45, 395)">
    <rect width="1010" height="30" rx="6" fill="#141a10" stroke="#26331d" stroke-width="1" />
    <circle cx="20" cy="15" r="3.5" fill="#a3e635" />
    <text x="34" y="19" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">
      STATE PIPELINE // ZERO EXTERNAL RUNTIME DEPENDENCIES • PURE CLIENT ORCHESTRATION • 60FPS SYNCHRONIZED
    </text>
  </g>
</svg>
