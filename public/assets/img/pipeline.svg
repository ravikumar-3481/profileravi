<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Meeting ingestion pipeline</title>
  <desc id="d">Six stages from source to searchable vectors: source, audio prep, transcription, chunking, embedding, storage</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#71717a"/>
    </marker>
    <style>
      .step { fill: #18181b; stroke: #3f3f46; stroke-width: 1.5; }
      .num { font: 700 12px Inter, system-ui, sans-serif; fill: #818cf8; }
      .title { font: 700 15px Inter, system-ui, sans-serif; fill: #fafafa; }
      .sub { font: 400 11.5px Inter, system-ui, sans-serif; fill: #a1a1aa; }
      .edge { stroke: #71717a; stroke-width: 1.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="200" rx="20" fill="#09090b"/>

  <rect class="step" x="15" y="45" width="170" height="110" rx="14"/>
  <text class="num" x="30" y="68">01</text>
  <text class="title" x="30" y="92">Source</text>
  <text class="sub" x="30" y="114">YouTube URL</text>
  <text class="sub" x="30" y="130">Audio file · .txt</text>

  <rect class="step" x="215" y="45" width="170" height="110" rx="14"/>
  <text class="num" x="230" y="68">02</text>
  <text class="title" x="230" y="92">Audio Prep</text>
  <text class="sub" x="230" y="114">16 kHz mono WAV</text>
  <text class="sub" x="230" y="130">10 min / 25 s chunks</text>

  <rect class="step" x="415" y="45" width="170" height="110" rx="14"/>
  <text class="num" x="430" y="68">03</text>
  <text class="title" x="430" y="92">Transcribe</text>
  <text class="sub" x="430" y="114">Deepgram nova-3</text>
  <text class="sub" x="430" y="130">Sarvam for Hinglish</text>

  <rect class="step" x="615" y="45" width="170" height="110" rx="14"/>
  <text class="num" x="630" y="68">04</text>
  <text class="title" x="630" y="92">Clean &amp; Chunk</text>
  <text class="sub" x="630" y="114">900 chars</text>
  <text class="sub" x="630" y="130">180 overlap</text>

  <rect class="step" x="815" y="45" width="170" height="110" rx="14"/>
  <text class="num" x="830" y="68">05</text>
  <text class="title" x="830" y="92">Embed</text>
  <text class="sub" x="830" y="114">MiniLM-L6-v2</text>
  <text class="sub" x="830" y="130">384 dimensions</text>

  <rect class="step" x="1015" y="45" width="170" height="110" rx="14"/>
  <text class="num" x="1030" y="68">06</text>
  <text class="title" x="1030" y="92">Store</text>
  <text class="sub" x="1030" y="114">Pinecone vectors</text>
  <text class="sub" x="1030" y="130">Supabase metadata</text>

  <line class="edge" x1="185" y1="100" x2="215" y2="100"/>
  <line class="edge" x1="385" y1="100" x2="415" y2="100"/>
  <line class="edge" x1="585" y1="100" x2="615" y2="100"/>
  <line class="edge" x1="785" y1="100" x2="815" y2="100"/>
  <line class="edge" x1="985" y1="100" x2="1015" y2="100"/>
</svg>