<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">MeetingSense AI system architecture</title>
  <desc id="d">React client calls a FastAPI backend that coordinates Supabase, an ingestion pipeline, and a LangGraph agent backed by Pinecone and Mistral</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#71717a"/>
    </marker>
    <style>
      .box { fill: #18181b; stroke: #3f3f46; stroke-width: 1.5; }
      .box-accent { fill: #1e1b4b; stroke: #6366f1; stroke-width: 1.5; }
      .box-green { fill: #052e2b; stroke: #10b981; stroke-width: 1.5; }
      .title { font: 700 16px Inter, system-ui, sans-serif; fill: #fafafa; }
      .sub { font: 400 12px Inter, system-ui, sans-serif; fill: #a1a1aa; }
      .lane { font: 600 11px Inter, system-ui, sans-serif; fill: #71717a; letter-spacing: 1.5px; }
      .edge { stroke: #71717a; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1100" height="520" rx="20" fill="#09090b"/>

  <text class="lane" x="40" y="34">CLIENT</text>
  <text class="lane" x="300" y="34">API</text>
  <text class="lane" x="620" y="34">SERVICES</text>
  <text class="lane" x="900" y="34">EXTERNAL</text>

  <rect class="box-accent" x="40" y="215" width="180" height="90" rx="14"/>
  <text class="title" x="130" y="255" text-anchor="middle">React Client</text>
  <text class="sub" x="130" y="277" text-anchor="middle">Vite · Tailwind · Motion</text>

  <rect class="box-accent" x="300" y="215" width="180" height="90" rx="14"/>
  <text class="title" x="390" y="255" text-anchor="middle">FastAPI</text>
  <text class="sub" x="390" y="277" text-anchor="middle">REST · CORS · TTL cache</text>

  <rect class="box" x="620" y="50" width="200" height="80" rx="14"/>
  <text class="title" x="720" y="85" text-anchor="middle">Auth &amp; Data</text>
  <text class="sub" x="720" y="107" text-anchor="middle">Supabase client · RLS</text>

  <rect class="box" x="620" y="160" width="200" height="90" rx="14"/>
  <text class="title" x="720" y="196" text-anchor="middle">Ingestion Pipeline</text>
  <text class="sub" x="720" y="218" text-anchor="middle">yt-dlp · ffmpeg · chunking</text>

  <rect class="box-green" x="620" y="340" width="200" height="100" rx="14"/>
  <text class="title" x="720" y="376" text-anchor="middle">LangGraph Agent</text>
  <text class="sub" x="720" y="398" text-anchor="middle">11 tools · session state</text>
  <text class="sub" x="720" y="416" text-anchor="middle">RAG + cross-meeting</text>

  <rect class="box" x="900" y="50" width="170" height="80" rx="14"/>
  <text class="title" x="985" y="85" text-anchor="middle">Supabase</text>
  <text class="sub" x="985" y="107" text-anchor="middle">Auth · Postgres</text>

  <rect class="box" x="900" y="160" width="170" height="80" rx="14"/>
  <text class="title" x="985" y="195" text-anchor="middle">Deepgram / Sarvam</text>
  <text class="sub" x="985" y="217" text-anchor="middle">Speech-to-text</text>

  <rect class="box" x="900" y="270" width="170" height="80" rx="14"/>
  <text class="title" x="985" y="305" text-anchor="middle">Pinecone</text>
  <text class="sub" x="985" y="327" text-anchor="middle">Namespace per meeting</text>

  <rect class="box" x="900" y="380" width="170" height="80" rx="14"/>
  <text class="title" x="985" y="415" text-anchor="middle">Mistral</text>
  <text class="sub" x="985" y="437" text-anchor="middle">HF fallback</text>

  <path class="edge" d="M220 260H300"/>
  <path class="edge" d="M480 245C550 245 550 90 620 90"/>
  <path class="edge" d="M480 260C550 260 550 205 620 205"/>
  <path class="edge" d="M480 275C550 275 550 390 620 390"/>
  <path class="edge" d="M820 90H900"/>
  <path class="edge" d="M820 205H900"/>
  <path class="edge" d="M820 235C860 235 860 300 900 300"/>
  <path class="edge" d="M820 380C860 380 860 325 900 325"/>
  <path class="edge" d="M820 420C860 420 860 420 900 420"/>
  <path class="edge" d="M720 160V130"/>
</svg>